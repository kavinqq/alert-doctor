display_information:
  name: alert-doctor
  description: 看門狗告警分診與根因分析
features:
  bot_user:
    display_name: alert-doctor
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - chat:write
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email
      - usergroups:read
      - files:read
      - files:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - reaction_added
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
